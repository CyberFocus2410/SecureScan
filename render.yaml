services:
  - type: web
    name: securescan-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PIP_PREFER_BINARY
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SANDBOX_BACKEND
        value: hosted-container
      - key: SANDBOX_ALLOW_HOSTED_SUBPROCESS
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./securescan_dev.db
      - key: CORS_ORIGINS
        value: '["https://securescanbox.xyz","https://www.securescanbox.xyz","https://secure-scan-two.vercel.app","http://localhost:3000"]'
      - key: CORS_ORIGIN_REGEX
        value: '^https?:\/\/(localhost|127\.0\.0\.1|.*\.vercel\.app|(.*\.)?securescanbox\.xyz)(:\d+)?$'
