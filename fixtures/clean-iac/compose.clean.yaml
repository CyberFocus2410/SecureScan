services:
  web:
    image: web:1.0.0
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - internal_net

  db:
    image: postgres:15.4-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
