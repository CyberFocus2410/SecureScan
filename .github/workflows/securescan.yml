name: SecureScan Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Daily scan at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    name: SecureScan Audit & CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install SecureScan Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run SecureScan Doctor Diagnostics
        run: |
          python securescan.py doctor

      - name: Run CI Gate Check
        run: |
          echo "Evaluating CI Gate with threshold P0..."
          # Run mock / local audit gate evaluation
          python -c "print('SecureScan CI Gate initialized.')"
